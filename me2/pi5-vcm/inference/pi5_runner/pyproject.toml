[project]
name = "pi5-vcm-inference-runner"
version = "0.1.0"
description = "Wake-word and ME2 inference runner for Raspberry Pi"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.23,<3",
    "onnxruntime>=1.10,<2",
    "openwakeword==0.6.0",
    "piper-tts==1.8.0",
    "requests>=2,<3",
    "scikit-learn>=1,<2",
    "scipy>=1.3,<2",
    "tqdm>=4,<5",
]

[tool.uv]
exclude-dependencies = ["tflite-runtime"]
